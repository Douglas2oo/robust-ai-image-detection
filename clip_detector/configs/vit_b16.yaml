experiment: vit_b16_noaug

model:
  name: torchvision/vit_b_16-imagenet1k_v1
  feature_dim: 768
  freeze_encoder: true
  normalize_features: false # 与 UniversalFakeDetect 一致，不做 L2 归一化

paths:
  data_root: data
  manifest_dir: manifests
  cache_dir: cache/vit_b16
  checkpoint_dir: checkpoints/vit_b16
  output_dir: outputs/vit_b16

augmentation:
  enabled: false
  hflip: 0.5

features:
  views_per_image: 4 # 每张训练图预先抽 4 个视图；每个 epoch 随机取 1 个
  view_seed: 0 # 视图随机种子
  batch_size: 16
  num_workers: 6

training:
  loss: binary_cross_entropy_with_logits
  seeds: [0, 1, 2]
  learning_rates: [0.001, 0.0003, 0.0001] # 与 weight_decays 组成网格，按验证集 BCE 选择
  weight_decays: [0.0, 0.0001, 0.01]
  epochs: 400
  patience: 20
  batch_size: 512

evaluation:
  perturbations:
    [clean, jpeg90, jpeg70, jpeg50, down0.5, down0.25, blur0.5, blur1.0]
