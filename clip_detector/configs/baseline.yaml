# Frozen CLIP feature cache + linear probing baseline.
experiment: clip_baseline
seed: 42

model:
  name: ViT-L/14
  provider: openai_clip
  freeze_encoder: true
  output_dim: 1
  feature_dim: 768
  normalize_features: true

data:
  root: data
  train_manifest: manifests/train.csv
  val_manifest: manifests/val.csv
  image_size: 224
  color_mode: RGB
  normalization: pretrained_weights

training:
  loss: binary_cross_entropy_with_logits
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5

augmentation:
  enabled: false

features:
  mode: cached_original
  views_per_image: 1
  batch_size: 32
  cache_chunk_size: 512
  num_workers: 2
  cache_dir: cache/clip_baseline

paths:
  checkpoint_dir: checkpoints/clip_baseline
  output_dir: outputs/clip_baseline
