# Frozen CLIP features from two fixed augmented views per training image.
experiment: clip_augmented
seed: 42

model:
  name: ViT-L/14
  provider: openai_clip
  freeze_encoder: true
  output_dim: 1
  feature_dim: 768
  normalize_features: true

data:
  root: data
  train_manifest: manifests/train.csv
  val_manifest: manifests/val.csv
  image_size: 224
  color_mode: RGB
  normalization: pretrained_weights

training:
  loss: binary_cross_entropy_with_logits
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5

augmentation:
  enabled: true
  seed: 42
  order: [jpeg, resize, gaussian_blur]
  jpeg:
    probability: 0.5
    quality_range: [50, 100]
  resize:
    probability: 0.5
    scale_range: [0.5, 1.0]
  gaussian_blur:
    probability: 0.5
    sigma_range: [0.1, 1.0]

features:
  mode: cached_augmented_views
  views_per_image: 2
  batch_size: 32
  cache_chunk_size: 512
  num_workers: 2
  cache_dir: cache/clip_augmented

paths:
  checkpoint_dir: checkpoints/clip_augmented
  output_dir: outputs/clip_augmented
